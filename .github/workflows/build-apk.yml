name: Build & Publish Scribit APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: scribit-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android 36 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare friendly APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk Scribit.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scribit-APK
          path: Scribit.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Scribit.apk \
            --target "$GITHUB_SHA" \
            --title "Scribit — Build #${GITHUB_RUN_NUMBER}" \
            --notes "Automatic installable build from commit $GITHUB_SHA on main." \
            --latest
